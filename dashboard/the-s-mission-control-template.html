<script>
(()=>{
const root=document.getElementById('mc-mission'),page=root.querySelector('#mc-page'),overlay=root.querySelector('#mc-overlay');
let liveState=null,feed=null,pollTimer=null,sseConnected=false,hydrating=false,lastStateAt=0,agentDossier=null,drawerRequest=0;
const agentMeta=[['mira'.toUpperCase(),'CO','Coordination','Coordination'],['sage'.toUpperCase(),'RE','Research & sourcing','Research and Sourcing'],['seline'.toUpperCase(),'WR','Writing & editing','Writing and Editing'],['surge'.toUpperCase(),'GR','Growth & marketing','Marketing, Growth, Monetization'],['spectra'.toUpperCase(),'EN','Engineering','Engineering, Automation, Integrations']];
const agents=agentMeta.map(([name,initials,role,detail],i)=>({name,initials,role:window.MissionBrand.current.agents[i].role,detail,currentRun:null,task:null,count:null,share:null,load:null,model:null,state:null}));
document.addEventListener('mission-brand-change',()=>{agents.forEach((a,i)=>{a.role=window.MissionBrand.current.agents[i].role;});if(typeof render==='function')render();});
const numeric=value=>typeof value==='number'&&Number.isFinite(value)&&value>=0;
const display=value=>value===null||value===undefined||value===''?'Unavailable':esc(value);
const percent=value=>numeric(value)?Math.min(100,value)+'%':'Unavailable';
const barWidth=value=>numeric(value)?Math.min(100,value):0;
function applyState(data,snapshotScheduleEpoch=scheduleEpoch){
 lastStateAt=Date.now();
 liveState=data&&typeof data==='object'&&!Array.isArray(data)?data:null;
 const boardChanged=receiveBoardSnapshot(liveState);
 const scheduleChanged=snapshotScheduleEpoch===scheduleEpoch&&receiveScheduleSnapshot(liveState);
 const fleet=Array.isArray(liveState?.fleet)?liveState.fleet:[];
 agents.forEach((agent,i)=>{
  const row=fleet.find(item=>item&&String(item.id||item.name||'').toUpperCase()===agent.name)||{};
  Object.assign(agent,{role:window.MissionBrand.current.agents[i].role,task:typeof row.task==='string'&&row.task?row.task:null,count:numeric(row.tasksToday)?row.tasksToday:null,share:numeric(row.share)?row.share:null,load:numeric(row.load)?row.load:null,model:typeof row.defaultModel==='string'&&row.defaultModel?row.defaultModel:null,state:activityStateFor(agent.name,liveState),currentRun:row.current_run&&typeof row.current_run==='object'?row.current_run:null});
 });
 active=new Set(agents.filter(agent=>agent.state==='WORKING').map(agent=>agent.name));
 if(current==='Overview'||current==='Agents')render();
 else if(current==='Tasks'&&boardChanged&&dragged===null&&!boardBusy)render();
 else if(current==='Schedule'&&scheduleChanged)render();
 else if(current==='Office')refreshOfficeActivity();
 else if(current==='Chat')refreshChatStatus();
 if(agentDossier!==null&&!overlay.hidden)renderWorkDrawer(agentDossier.index,agentDossier.runId);
}
async function hydrate(){
 if(hydrating)return;hydrating=true;const snapshotScheduleEpoch=scheduleEpoch;
 try{const response=await fetch('/api/state',{cache:'no-store',signal:AbortSignal.timeout(8000)});if(!response.ok)throw new Error('API unavailable');applyState(await response.json(),snapshotScheduleEpoch);}
 catch(error){sseConnected=false;applyState(null,snapshotScheduleEpoch);}
 finally{hydrating=false;}
}
function startPolling(){if(!pollTimer)pollTimer=setInterval(()=>{if(!sseConnected||Date.now()-lastStateAt>10000)return hydrate();},6000);return pollTimer;}
function connectSSE(){
 if(typeof EventSource==='undefined'){startPolling();return null;}
 feed=new EventSource('/events');
 feed.onopen=()=>{sseConnected=true;};
 feed.addEventListener('state',event=>{try{applyState(JSON.parse(event.data));sseConnected=true;}catch(error){sseConnected=false;applyState(null);}});
 feed.onerror=()=>{sseConnected=false;applyState(null);startPolling();};
 return feed;
}
function agentStatus(agent){return isBusy(agent)?'WORKING':agent.state==='IDLE'?'IDLE':'Unavailable';}
function activityStateFor(name,data){
 const id=name.toLowerCase(),profile=id==='mira'?'default':id,activity=data?.activity;
 if(activity?.source!=='gateway-control/active-work'||!Number.isFinite(Date.parse(activity.observed_at)))return 'UNAVAILABLE';
 const record=activity.profiles?.[id];
 if(!record||record.runtime_profile!==profile||!['WORKING','IDLE'].includes(record.state)||!Number.isInteger(record.active_work_count)||record.active_work_count<0)return 'UNAVAILABLE';
 if(!Array.isArray(data?.working_agents))return 'UNAVAILABLE';
 const listed=data.working_agents.includes(id);
 if(record.state==='WORKING')return listed&&record.active_work_count>0?'WORKING':'UNAVAILABLE';
 return !listed&&record.active_work_count===0?'IDLE':'UNAVAILABLE';
}
function workingCount(){return agents.every(a=>a.state==='WORKING'||a.state==='IDLE')?active.size:'Unavailable';}
function refreshOfficeActivity(){
 const count=page.querySelector('[data-working-count]');if(count)count.textContent=workingCount();
 page.querySelectorAll('.agent-key [data-toggle]').forEach(button=>{
  const agent=agents[Number(button.dataset.toggle)];if(!agent)return;
  button.classList.toggle('active',isBusy(agent));
  button.textContent=agent.name+' · '+agentStatus(agent);
  button.disabled=true;button.onclick=null;
 });
 italicNames();
}
function disableSimulation(){
 // Telemetry indicators are not interactive preview toggles. Selection controls stay live.
 root.querySelectorAll('[data-toggle]').forEach(control=>{control.disabled=true;control.title='Authoritative live activity — read-only';control.onclick=null;});
}
function selectionIncludes(agent){return selectionMode==='all'||agent.name===selectedAgent;}
function initializeSelectionControls(){}
function unsupportedAgentAction(action){
 drawerRequest++;agentDossier=null;
 drawer(`<div class="eyebrow">AGENT CONTROL CAPABILITY</div><h2>${esc(action)}</h2><p style="margin-top:12px">Unavailable: the dashboard backend has no real wake/idle operation.</p><p style="margin-top:12px">The original buttons controlled a browser-only visual simulation, not agents. No operation has been sent and real activity has not changed.</p><p style="margin-top:12px">All agents / Custom selection now selects which agents' cards and work records are shown. It does not start, stop or pause an agent.</p>`);
}

const tabs=['Overview','Agents','Office','Tasks','Schedule','Chat','Content','CRM','Docs'];let current='Overview',active=new Set(),chatAgent=0,docIndex=0,rotation=.6,rotating=true,zoom=1,dragged=null,frame=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const design={rotate:true};let selectedAgent='sage'.toUpperCase(),selectionMode='all';
const saved=window.openai?.widgetState?.modelContent;if(saved&&tabs.includes(saved.tab))current=saved.tab;
const BOARD_STATUSES=['todo','in_progress','done'];
let tasks=[],boardState='loading',boardSignature='',pendingBoardSnapshot=null,boardBusy=false,boardError='';
let docs=[],contentLoaded=false,contentLoading=false,contentError='',contentLoadGeneration=0,contentDocGeneration=0,contentBusy=false,contentViewOpen=false,contentSelectedKey=readContentSelection(),contentStatusKey='',contentStatusMessage='';
let jobs=[],scheduleState='loading',scheduleSignature='',scheduleBusy=false,scheduleMessage='',scheduleEpoch=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const isBusy=a=>active.has(a.name);const avatar=a=>`<span class="avatar ${isBusy(a)?'busy':''}">${esc(window.MissionBrand.current.agents.find(row=>row.id===a.name.toLowerCase())?.initials||a.initials)}</span>`;

function hero(title,sub,extra=''){return `<section class="hero"><div class="hero-top"><div><div class="eyebrow"><span data-brand="name">Mission Control</span> / ${esc(current)}</div><h1>${title}</h1><p>${sub}</p></div><span class="badge"><span class="point"></span> Workspace WORKSPACE</span></div>${extra}</section>`;}
const panelStat=(label,value,caption='')=>`<section class="panel"><div class="eyebrow">${label}</div><div class="big">${value}</div><p>${caption}</p></section>`;
function network(){const coords=[[20,23],[80,23],[80,79],[20,79]];return `<div class="network" aria-label="Mission Control central hub and four specialists: sage, seline, surge, spectra. Red means working."><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${coords.map(p=>`<line x1="50" y1="49" x2="${p[0]}" y2="${p[1]}"/>`).join('')}</svg><div class="core ${active.size?'live':''}" data-brand="logo_text">MC</div>${agents.slice(1).map((a,i)=>`<button class="node ${isBusy(a)?'working':''}" style="left:${coords[i][0]}%;top:${coords[i][1]}%" data-toggle="${i+1}" aria-label="${a.name}: ${agentStatus(a)}. Live activity is read-only.">${a.initials}</button>`).join('')}</div>`;}
function currentTaskLabel(a){
 if(a.state==='IDLE')return 'No current task';
 if(a.state!=='WORKING')return 'Unavailable';
 return a.currentRun?.task||'Current task unavailable in approved scope';
}
function runStatus(run){return ({working:'Working',completed:'Completed',failed:'Failed',interrupted:'Interrupted',pending_settlement:'Awaiting settlement',unknown:'Unavailable'})[run?.status]||'Unavailable';}
function submittedTime(value){const at=new Date(value);return value&&Number.isFinite(at.getTime())?at.toLocaleString():'Unavailable';}
function recordedRunShare(agent){
 const total=liveState?.work?.stats?.total;
 if(!Number.isInteger(agent.count)||agent.count<0||!Number.isInteger(total)||total<=0||agent.count>total)return null;
 return Math.round(agent.count/total*1000)/10;
}
function recordedActiveCount(agent){
 const count=liveState?.activity?.profiles?.[agent.name.toLowerCase()]?.active_work_count;

function roster(){return `<div class="roster">${agents.map((a,i)=>{

 return `<button class="agent" data-agent="${i}">${avatar(a)}<div class="agent-name-row"><h3>${a.name}</h3><span class="agent-run-tag" title="${numeric(a.count)?a.count+' finished executions in the approved group':'Run count unavailable'}${share!==null?' · '+share+'% of fleet finished executions':''}">${numeric(a.count)?a.count+' runs':'Unavailable'}${share!==null?' · '+share+'%':''}</span></div><small>${esc(a.role.toUpperCase())}</small><p title="${esc(currentTaskLabel(a))}">${esc(currentTaskLabel(a))}</p><div class="bar" data-activity-state="${agentStatus(a)}" data-run-share="${share??''}" role="${share!==null?'meter':'img'}" ${share!==null?'aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+share+'"':''} aria-label="${a.name}: Run share ${share!==null?share+'%':'unavailable'}. Share of finished fleet executions, not capacity or task-completion progress" title="${esc(caption)} — not capacity or task progress"><span class="run-share-fill" style="width:${share??0}%"></span></div><small class="run-share-caption">${esc(caption)}</small><span class="agent-state ${isBusy(a)?'busy':''}" data-live-active="${isBusy(a)}"><span class="live-work-dot" aria-hidden="true"></span>${agentStatus(a)}${isBusy(a)&&activeCount!==null?' · '+activeCount+' active':''} ↗</span></button>`;
 }).join('')}</div>`;}

function activityRows(){
 const working=agents.filter(a=>isBusy(a)&&selectionIncludes(a)).map(a=>({agent:a,run:a.currentRun,working:true}));
 const recent=selectionMode==='custom'?recentHistory(liveState?.work?.profiles?.[selectedAgent.toLowerCase()]).filter(run=>run.status==='completed'):(Array.isArray(liveState?.work?.recent_completed)?liveState.work.recent_completed:[]);
 const done=recent.map(run=>({agent:agents.find(a=>a.name.toLowerCase()===run.agent),run,working:false})).filter(item=>item.agent&&selectionIncludes(item.agent));
 const items=[...working,...done].slice(0,6);
 if(!items.length)return `<div class="activity-empty">${liveState?.work?.status==='available'?'No recorded activity':'Unavailable'}<small>${liveState?.work?.status==='available'?'No matching work in the retained Mission Control group history.':'Execution-ledger task details are unavailable.'}</small></div>`;
 return items.map(item=>`<button class="activity-row ${item.working?'in-flight':'finished'}" data-work-agent="${agents.indexOf(item.agent)}" data-run-id="${item.run?.id||''}"><span class="activity-agent">${item.agent.name}<span class="work-indicator"></span></span><span class="work-title" title="${esc(item.run?.task||currentTaskLabel(item.agent))}">${display(item.run?.task||currentTaskLabel(item.agent))}</span><small>${item.working?'WORKING NOW':'TURN COMPLETED'}${item.run?.submitted_at?' · SUBMITTED '+esc(submittedTime(item.run.submitted_at)):''} ↗</small></button>`).join('');

const crmState={host:null,data:null,csrf:null,view:localStorage.getItem('mc-crm-view')||'Pipeline',loading:false,busy:false,error:'',selected:null,timer:null};
const crmEsc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const crmStages=['New lead','Qualified','Meeting','Proposal','Won','Lost','Disqualified'];
const crmAgents=['mira'.toUpperCase(),'sage'.toUpperCase(),'seline'.toUpperCase(),'surge'.toUpperCase(),'spectra'.toUpperCase()];
function crmAmount(value,code){if(value===null||value===undefined)return 'Unvalued';const parts=String(value).split('.');return crmEsc(code)+' '+crmEsc(parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',')+'.'+(parts[1]||'').padEnd(2,'0'));}
function crmMoney(totals){return totals&&Object.keys(totals).length?Object.keys(totals).sort().map(code=>crmAmount(totals[code],code)).join(' · '):'—';}
function crmDate(value){if(!value)return 'Not scheduled';const d=new Date(value);return Number.isNaN(d.valueOf())?'Unavailable':crmEsc(d.toLocaleString('en-GB',{}))+' local';}

function crmOpportunity(id){return crmState.data?.opportunities.find(o=>o.id===id);}

const crmStageWords={research:'prospect research',rank:'commercial review',feasibility:'technical review',draft:'internal draft preparation',followup:'follow-up draft preparation',friday:'weekly response review'};
function crmReadObject(value){try{const result=typeof value==='string'?JSON.parse(value):value;return result&&typeof result==='object'&&!Array.isArray(result)?result:null;}catch(_){return null;}}
function crmCleanProse(value){
 return String(value??'').replace(/\bSource\s+(?:initial-proposal-import-review:)?[a-f0-9]{32,64}\b\.?/gi,'').replace(/\b(?:selected_opportunity_ids|feasible_opportunity_ids|draft_ids|opportunity_ids)\s*[=:]\s*\[[^\]]*\]/gi,'the selection is recorded in the protected history')

}
function crmPlainText(value){

 const item=crmReadObject(text);
 if(item){
  const stage=crmStageWords[item.stage]||'team work';
  if(item.schema==='nov26-action-v2')return ({research:'Research prospective businesses and record the sources.',rank:'Review commercial fit before deciding whether technical assessment is appropriate.',feasibility:'Assess bounded technical feasibility and record the conditions and milestones.',draft:'Prepare an internal draft using the verified scope. No message is sent.',followup:'Prepare an internal follow-up draft for the recorded next step. No message is sent.',friday:'Review actual response evidence and record any justified adjustment.'})[item.stage]||'mira will review and coordinate this recorded next step.';
  if(item.schema==='nov26-worker-ready-v2'||item.schema==='nov26-ready-v1'){
   let summary=item.result==='completed'?'The agent reported '+stage+' complete. mira verifies the handoff before advancing the work.':'The agent recorded an update on '+stage+'. mira review is required.';
   if(item.result==='blocked')summary='The agent reported a blocker in '+stage+'. mira review is required.';

function projectOrbitPoint(angle,width,height){const radius=width*.32,x=Math.cos(angle)*radius,z=Math.sin(angle)*radius*.62,y=Math.sin(angle)*height*.30,scale=600/(600-z);return {x,y,z,scale,screenX:width/2+x*scale,screenY:height/2+y*scale};}
function projectWireEndpoint(point,width,height,radius){const dx=point.screenX-width/2,dy=point.screenY-height/2,d=Math.hypot(dx,dy);if(!d)return {x:point.screenX,y:point.screenY};const r=radius*point.scale;return {x:point.screenX-dx/d*r,y:point.screenY-dy/d*r};}
function ovConstellation3D(){return `<div class="ov-constellation ov-3d ${active.size?'fleet-active':''}" aria-label="mira and four specialists in a rotating 3D constellation. Red means verified Working; mira’s halo reflects fleet activity. Cable flow is decorative."><div class="ov-orbit"><svg class="ov-cables" aria-hidden="true">${agents.slice(1).map((a,j)=>`<g data-ov-cable="${j+1}"><path class="ov-wire-shadow"/><path class="ov-wire"/><path class="ov-electric"/></g>`).join('')}</svg>${agents.slice(1).map((a,j)=>`<button class="ov-satellite" data-agent="${j+1}" aria-label="${a.name}: ${ovStatus(a)}"><span class="ov-orbit-counter ${isBusy(a)?'working':''}" data-ov-glow="${j+1}" data-brand-code="${a.name.toLowerCase()}">${esc(window.MissionBrand.current.agents.find(row=>row.id===a.name.toLowerCase())?.initials||a.initials)}</span></button>`).join('')}</div><button class="ov-hub ${isBusy(agents[0])?'working':''}" data-agent="0" data-ov-glow="0" aria-label="mira: ${ovStatus(agents[0])}"><span data-brand-code="mira">CO</span><small data-brand-agent="mira">Coordination</small></button></div>`;}
function ensureConstellationMotion(){
 const node=page.querySelector('.ov-3d');if(!node)return;
 if(node._ovMotion){node._ovMotion.draw(performance.now());return;}
 const media=matchMedia('(prefers-reduced-motion: reduce)'),state={raf:0,last:0};
 state.draw=now=>{
  if(!node.isConnected)return;const w=node.clientWidth,h=node.clientHeight,phase=media.matches?0:now/70000*Math.PI*2;
  node.querySelector('svg').setAttribute('viewBox',`0 0 ${w} ${h}`);
  node.querySelectorAll('.ov-satellite').forEach((button,j)=>{
   const p=projectOrbitPoint(phase+j*Math.PI/2,w,h),i=j+1;
   button.style.transform=`translate3d(${p.x}px,${p.y}px,${p.z}px) translate(-50%,-50%)`;
   const cable=node.querySelector('[data-ov-cable="'+i+'"]'),bend=media.matches?0:Math.sin(now/550+j)*4;
   // A back-depth sphere sits behind the SVG plane: stop at its edge so wires never obscure initials.
   const end=projectWireEndpoint(p,w,h,button.clientWidth/2),d=`M ${w/2} ${h/2} Q ${(w/2+end.x)/2+bend} ${(h/2+end.y)/2+14} ${end.x} ${end.y}`;
   cable.querySelectorAll('path').forEach(path=>path.setAttribute('d',d));cable.classList.toggle('working',isBusy(agents[i]));
  });
 };
 const tick=now=>{if(!node.isConnected){state.raf=0;return;}if(media.matches){state.draw(now);state.raf=0;return;}if(now-state.last>33){state.draw(now);state.last=now;}state.raf=requestAnimationFrame(tick);};
 state.restart=()=>{if(state.raf)cancelAnimationFrame(state.raf);state.raf=0;state.draw(performance.now());if(!media.matches)state.raf=requestAnimationFrame(tick);};node._ovMotion=state;state.restart();
}

const AG15_AGENTS=['mira'.toUpperCase(),'sage'.toUpperCase(),'seline'.toUpperCase(),'surge'.toUpperCase(),'spectra'.toUpperCase()];
function ag15ModelRow(data,agent){
 if(!AG15_AGENTS.includes(agent))return null;
 return data?.fleet?.find(row=>row.name===agent)||null;
}
function ag15ModelChoices(data,agent){
 if(!AG15_AGENTS.includes(agent))return [];
 const account=data?.accounts?.agents?.find(row=>row.agent===agent);
 if(!account)return [];
 return (data?.catalog?.models||[]).filter(row=>row.selectable===true&&
  (row.provider==='openai-codex'&&account.openai?.connected===true&&account.openai?.billing_mode==='subscription_included'
   ||row.provider==='nous'&&account.nous?.switch_available===true));
}
function ag15ModelStatus(data,draft,agent,now=Date.now()){
 const row=ag15ModelRow(data,agent),account=data?.accounts?.agents?.find(item=>item.agent===agent);
 const effective=row?.provider&&row?.model?row.provider+'|'+row.model:null;
 const value=draft?.draft_models?.[agent];
 // Preserve an invalid supplied draft literally, but never make it eligible.
 const selected=typeof value==='string'&&value?value:effective;
 const choices=ag15ModelChoices(data,agent),eligible=choices.some(item=>item.key===selected);
 const observed=Date.parse(account?.observed_at),age=(now-observed)/1000;
 const fresh=Number.isFinite(age)&&age>=-30&&age<=900;
 const changed=!!selected&&selected!==effective;
 const enabled=data?.live_mutations_enabled===true;
 let reason=!row?'Native model metadata unavailable':row.control_available!==true?'Native model control unavailable':
  !enabled?'Preview: native model changes are disabled':!fresh?'Refresh account verification before Apply':
  !eligible?'Selection is not available and authorised for this agent':!changed?'Effective default already selected':'Draft selection — not applied';
 return {effective,selected,choices,changed,fresh,eligible,
  apply_allowed:!!row&&row.control_available===true&&enabled&&fresh&&eligible&&changed,
  working:row?.current_activity?.state==='WORKING',
  pending:row?.pending_model?{provider:row.pending_provider,model:row.pending_model}:null,
  reason};
}


function ag15Distribution(data, esc) {
  var d = data.distribution || {}, names = ['mira','sage','seline','surge','spectra'];
  var colors = ['#c7cabf','#fa754e','#ffac76','#c94b20','#ffe0ba'];
  var rows = names.map(function (name) { return (d.rows || []).filter(function (r) { return String(r.agent).toLowerCase()===name; })[0] || {agent:name,count:null,share_pct:null}; });
  var total = d.total;
  var complete = typeof total==='number' && Number.isFinite(total) && total>=0 && (!data.coverage || data.coverage.all_sources_available !== false);
  var percentagesValid = rows.every(function(r){return typeof r.share_pct==='number' && Number.isFinite(r.share_pct) && r.share_pct>=0 && r.share_pct<=100 && typeof r.count==='number' && r.count>=0;});
  var sum = rows.reduce(function(a,r){return a+(typeof r.share_pct==='number'?r.share_pct:0);},0);
  var populated = complete && total>0 && percentagesValid && Math.abs(sum-100)<0.11;
  var zero = complete && total===0;
  var cursor = 0, stops=[];
  if(populated) rows.forEach(function(r,i){var start=cursor;cursor+=r.share_pct;stops.push(colors[i]+' '+start+'% '+cursor+'%');});
  var state = populated ? total+' logged runs' : zero ? '0 logged runs' : 'Unavailable';
  var labels = rows.map(function(r,i){return '<li class="ag15-dist-row"><i style="background:'+colors[i]+'" aria-hidden="true"></i><span>'+names[i].toUpperCase()+'</span><strong>'+(populated ? r.share_pct.toFixed(1)+'%' : 'Unavailable')+'</strong></li>';}).join('');
  return '<section class="panel ag15-distribution"><h3>TASK DISTRIBUTION</h3><p>Share of total cycles</p><div class="ag15-donut'+(!populated?' ag15-donut-empty':'')+'" role="img" aria-label="'+esc(state)+'; agent shares listed below"'+(populated?' style="background:conic-gradient('+stops.join(',')+')"':'')+'><div><strong>'+(populated ? total : esc(state))+'</strong>'+(populated ? '<span>logged runs</span>' : '')+'</div></div><ul class="ag15-dist-list">'+labels+'</ul><p>Cycles here means logged runs submitted in the stated period; not completed business tasks.</p></section>';
}
function ag15Timestamp(value) {
  if(typeof value!=='string' || !/(?:Z|[+-]\d{2}:\d{2})$/i.test(value)) return 'Unavailable';
  var date = new Date(value);
  if(!Number.isFinite(date.getTime()) || date.getTime()<=0 || date.getTime()>Date.now()) return 'Unavailable';
  var parts = new Intl.DateTimeFormat('en-GB',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(date);
  function part(type){return parts.filter(function(p){return p.type===type;})[0].value;}
  return part('year')+'-'+part('month')+'-'+part('day')+' '+part('hour')+':'+part('minute')+':'+part('second');
}
function ag15Logs(data,esc) {
  var recent = (Array.isArray(data.recent)?data.recent:[]).slice(0,20);
  var body = recent.map(function(r){
    var status = typeof r.status==='string' && r.status.trim() ? r.status : 'unknown';
    status = status.charAt(0).toUpperCase()+status.slice(1);
    return '<tr class="ag15-log-row"><td>'+esc(ag15Timestamp(r.submitted_at))+'</td><td>'+esc(typeof r.agent==='string'?r.agent.toUpperCase():'Unavailable')+'</td><td class="ag15-task">'+esc(r.task==null?'Unavailable':r.task)+'</td><td class="ag15-model">'+esc(r.model==null || r.model===''?'Unavailable':r.model)+'</td><td>'+esc(status)+'</td></tr>';
  }).join('');
  return '<section class="panel ag15-logs"><div class="ag15-logs-heading"><h3>AGENT LOGS • RECENT</h3><span class="ag15-count">Showing '+recent.length+' of latest 20</span></div><p>Every logged run across the fleet</p><div class="ag15-table-scroll" tabindex="0" aria-label="Scrollable recent logs"><table><caption>Latest 20 retained records, not the entire historical log. TIME uses Local time. Retained Mission Control group scope.</caption><thead><tr><th scope="col">TIME</th><th scope="col">AGENT</th><th scope="col">TASK</th><th scope="col" title="Exact recorded model; Unavailable if the ledger did not record it">MODEL</th><th scope="col">STATUS</th></tr></thead><tbody>'+body+(recent.length?'':'<tr><td colspan="5">'+(data.coverage && data.coverage.all_sources_available===true ? 'No recorded runs in retained recent history.' : 'Recent logs unavailable.')+'</td></tr>')+'</tbody></table></div></section>';
}
// Call once per mounted container; invoke returned disposer before discarding it.
function ag15WireAnalytics(container) {
  function show(event) {
    var cell = event.target && event.target.closest ? event.target.closest('[data-ag15-cell]') : null;
    if(!cell || !container.contains(cell)) return;
    var output = container.querySelector('.ag15-tooltip');
    if(output) output.textContent = cell.getAttribute('data-ag15-tip');
  }
  ['click','focusin','pointerover'].forEach(function(name){container.addEventListener(name,show);});
  return function(){['click','focusin','pointerover'].forEach(function(name){container.removeEventListener(name,show);});};
}
function ag15Escape(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}
function ag15Analytics(data, escapeFn) {
  data = data || {};
  var esc = typeof escapeFn === 'function' ? escapeFn : ag15Escape;
  var period = data.period || {}, heat = data.heatmap || {}, coverage = data.coverage || {};
  var days = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  var rows = Array.isArray(heat.rows) ? heat.rows : [];
  var max = 1;
  rows.forEach(function (r) { (r.hours || []).forEach(function (c) { if (typeof c.count === 'number') max = Math.max(max,c.count); }); });
  var hours = '<span></span>';
  for (var h=0; h<24; h++) hours += '<span class="ag15-hour">'+(h%4===0 || h===23 ? String(h).padStart(2,'0') : '<span class="ag15-sr">'+String(h).padStart(2,'0')+'</span>')+'</span>';
  var grid = days.map(function (day,index) {
    var row = rows.filter(function (r) { return r.weekday === index; })[0] || {};
    var cells = '<span class="ag15-day">'+day+'</span>';
    for (var hour=0; hour<24; hour++) {
      var cell = (row.hours || []).filter(function (c) { return c.hour === hour; })[0] || {};
      var available = typeof cell.count === 'number' && Number.isFinite(cell.count) && cell.count >= 0;
      var level = !available ? 'missing' : cell.count===0 ? 'zero' : 'l'+Math.min(4,Math.max(1,Math.ceil(cell.count/max*4)));
      var tip = day+' '+(row.date || 'date unavailable')+' '+String(hour).padStart(2,'0')+':00–'+String(hour).padStart(2,'0')+':59 '+(period.timezone || 'Local time')+' — '+(available ? cell.count+' logged runs' : 'Unavailable'+(typeof cell.known_count==='number' ? '; known lower bound: '+cell.known_count+' logged runs' : ''));
      cells += '<button type="button" class="ag15-cell ag15-'+level+'" data-ag15-cell="'+index+'-'+hour+'" data-ag15-tip="'+esc(tip)+'" title="'+esc(tip)+'" aria-label="'+esc(tip)+'"></button>';
    }
    return cells;
  }).join('');
  function metric(value) { return value && typeof value.count==='number' ? String(value.hour).padStart(2,'0')+':00 · '+value.count+' logged runs'+(value.count===0 ? ' — No recorded runs' : '') : 'Unavailable'; }
  return '<section class="ag15-analytics" aria-label="Agents analytics"><div class="ag15-analytics-row"><section class="panel ag15-heatmap"><div class="ag15-heat-heading"><h3>ACTIVITY HEATMAP • 7D • 24H</h3><div class="ag15-legend">Cool <i class="ag15-zero"></i><i class="ag15-l1"></i><i class="ag15-l2"></i><i class="ag15-l3"></i><i class="ag15-l4"></i> Hot · <i class="ag15-missing"></i> Unavailable</div></div><p>Log submissions by hour · '+esc(period.timezone || 'Local time')+'</p><p>'+esc(period.start || 'Unavailable')+' → '+esc(period.end || 'Unavailable')+' · Last seven complete calendar days</p><p>'+esc(coverage.scope_note || 'Retained Mission Control group scope')+'</p><div class="ag15-heat-scroll" tabindex="0" aria-label="Scrollable hourly heatmap"><div class="ag15-grid">'+hours+grid+'</div></div><output class="ag15-tooltip" aria-live="polite">Focus, hover or tap a tile for its exact count.</output><dl class="ag15-heat-stats"><div><dt>Peak hour</dt><dd>'+esc(metric(heat.peak_hour))+'</dd></div><div><dt>Quietest hour</dt><dd>'+esc(metric(heat.quietest_hour))+'</dd></div><div><dt>Weekday average</dt><dd>'+esc(typeof heat.weekday_average==='number' ? heat.weekday_average+' logged runs per weekday' : 'Unavailable')+'</dd></div></dl></section>'+ag15Distribution(data,esc)+'</div>'+ag15Logs(data,esc)+'</section>';
}

// Personal-board bindings: never attach an agent, assignee, avatar or model.
function parseBoardSnapshot(data){
 const unavailable={state:'unavailable',rows:[],mapped:[],signature:'unavailable'};
 if(data?.board_status!=='available'||!Array.isArray(data.board))return unavailable;
 const seen=new Set(),mapped=[];
 for(const row of data.board){
  if(!row||!Number.isSafeInteger(row.id)||row.id<=0||seen.has(row.id)||typeof row.title!=='string'||typeof row.priority!=='string'||!BOARD_STATUSES.includes(row.status))return unavailable;
  seen.add(row.id);
  mapped.push({id:mapped.length+1,boardId:row.id,title:row.title,status:BOARD_STATUSES.indexOf(row.status),priority:row.priority==='normal'?'P2':row.priority==='high'?'P1':row.priority==='low'?'P3':row.priority});
 }
 return {state:'available',rows:data.board,mapped,signature:JSON.stringify(mapped)};
}
function installBoardSnapshot(snapshot){
 const changed=boardState!==snapshot.state||boardSignature!==snapshot.signature;
 boardState=snapshot.state;boardSignature=snapshot.signature;tasks=snapshot.mapped;
 return changed;
}
function receiveBoardSnapshot(data){
 const snapshot=parseBoardSnapshot(data);
 // Never replace the live draggable node or remap its display ID mid-drag.
 if(dragged!==null||boardBusy){pendingBoardSnapshot=snapshot;return false;}
 return installBoardSnapshot(snapshot);
}
function flushBoardSnapshot(){
 if(dragged!==null||boardBusy||!pendingBoardSnapshot)return;
 const snapshot=pendingBoardSnapshot;pendingBoardSnapshot=null;
 if(installBoardSnapshot(snapshot)&&current==='Tasks')render();
}
function syncBoardActions(){
 const blocked=boardBusy||boardState!=='available';
 if(current==='Tasks')page.setAttribute('aria-busy',String(boardBusy));
 page.querySelectorAll('[data-newtask],[data-move],[data-delete-task]').forEach(button=>{button.disabled=blocked;button.title=boardState==='available'?'':'Personal board data is unavailable';});
 page.querySelectorAll('[data-task]').forEach(card=>{card.draggable=!blocked;});
}
function reportBoardError(error){
 boardError=error?.message||'The board change could not be confirmed. Recheck the board before retrying.';
 if(current==='Tasks')render();
}
async function persistBoard(path,payload,expected){
 if(boardBusy)throw new Error('Another board change is being saved. Please try again.');
 if(boardState!=='available')throw new Error('Personal board data is unavailable. Nothing has been changed locally.');
 boardBusy=true;boardError='';syncBoardActions();let verified=false;
 try{
  const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',cache:'no-store',signal:AbortSignal.timeout(8000),body:JSON.stringify(payload)});
  const result=await response.json();
  if(!response.ok)throw new Error(result.error||'Board write was rejected');
  // Coalesce with an existing hydration rather than allowing its older rows to win.
  const deadline=Date.now()+8500;
  while(hydrating&&Date.now()<deadline)await new Promise(resolve=>setTimeout(resolve,25));
  await hydrate();
  // Exact read-back is uncached and verifies persistence, not merely HTTP success.
  const check=await fetch('/api/board',{cache:'no-store',credentials:'same-origin',signal:AbortSignal.timeout(8000)});
  if(!check.ok)throw new Error('Unable to read back the saved board');
  const rows=await check.json(),snapshot=parseBoardSnapshot({board_status:'available',board:rows});
  if(snapshot.state!=='available')throw new Error('The board returned an invalid task list');
  if(expected.kind==='delete'){
   if(result.deleted!==expected.id||rows.some(row=>row.id===expected.id))throw new Error('Deletion has not been confirmed');
  }else{
   const id=expected.kind==='create'?result.id:expected.id,row=rows.find(row=>row.id===id);
   if(!Number.isSafeInteger(id)||!row||row.status!==expected.status||(expected.kind==='create'&&(row.title!==expected.title||row.priority!==expected.priority)))throw new Error('The saved task did not match the requested change');
  }
  pendingBoardSnapshot=null;installBoardSnapshot(snapshot);
  if(liveState){liveState.board=rows;liveState.board_status='available';}
  verified=true;return result;
 }catch(error){
  boardError='Board change could not be confirmed: '+(error?.message||'connection error');
  throw new Error(boardError);
 }finally{
  boardBusy=false;
  if(!verified)flushBoardSnapshot();
  syncBoardActions();if(current==='Tasks')render();
 }
}
function createBoardTask(title,priority){
 if(typeof title!=='string'||!title.trim()||title.trim().length>500)return Promise.reject(new Error('Enter a mission title of 1–500 characters.'));
 const values={title:title.trim(),priority,status:BOARD_STATUSES[0]};
 return persistBoard('/api/board',values,{kind:'create',...values});
}
function moveBoardTask(displayId,column){

 if(!task||!Number.isInteger(column)||column<0||column>=BOARD_STATUSES.length)return Promise.reject(new Error('The selected task or column is unavailable.'));
 const status=BOARD_STATUSES[column];
 return persistBoard('/api/board/update?id='+encodeURIComponent(task.boardId),{status},{kind:'update',id:task.boardId,status});
}
function deleteBoardTask(displayId){
 const task=tasks.find(task=>task.id===displayId);
 if(!task)return Promise.reject(new Error('The selected task is unavailable.'));
 return persistBoard('/api/board/delete?id='+encodeURIComponent(task.boardId),{},{kind:'delete',id:task.boardId});
}

 if(newtask)newtask.onclick=()=>{
  drawerRequest++;agentDossier=null;
  drawer('<div class="eyebrow">YOUR PERSONAL BOARD</div><h2>New mission.</h2><form id="mc-task-form"><label>Mission title<input name="title" required maxlength="500" placeholder="What would you like to do?"></label><label>Priority <select name="priority"><option>P1</option><option selected>P2</option><option>P3</option></select></label><p data-board-error role="status" hidden></p><button class="primary" style="margin-top:20px" type="submit">Create mission</button></form>');
  const form=overlay.querySelector('#mc-task-form');
  form.onsubmit=async event=>{
   event.preventDefault();const values=new FormData(form),button=form.querySelector('button[type="submit"]'),message=form.querySelector('[data-board-error]');
   button.disabled=true;message.hidden=true;
   try{
    const created=await createBoardTask(values.get('title'),values.get('priority'));
    if(overlay.querySelector('#mc-task-form')===form){
     close();
     // Reveal the verified new card; opening the drawer scrolls the page to its top.
     if(current==='Tasks'){
      const task=tasks.find(task=>task.boardId===created.id);
      if(task)page.querySelector('[data-task="'+task.id+'"]')?.scrollIntoView({block:'center',behavior:reduced?'instant':'smooth'});
     }
    }
   }
   catch(error){message.textContent=error.message;message.hidden=false;}
   finally{button.disabled=false;}
  };
 };
 syncBoardActions();

// Real Chat state is separate from fleet telemetry and never contains demo replies.
const chatStates=agents.map(()=>({messages:[],loaded:false,loading:false,busy:false,telegram:false,canSend:false,error:'',draft:'',files:[],generation:0}));

const ChatRecovery = (()=>{
 const states=new Set(['accepted','waiting','completed','failed','unknown']);
 class Controller {
  constructor({agent,requestId,fetchStatus,onUpdate,relevant=()=>true,schedule=setTimeout,cancel=clearTimeout,maxPolls=90,interval=5000}){
   Object.assign(this,{agent,requestId,fetchStatus,onUpdate,relevant,schedule:(fn,ms)=>schedule(fn,ms),cancel:id=>cancel(id),maxPolls,interval});
   this.generation=0;this.active=false;this.count=0;this.timer=null;this.abort=null;this.inFlight=false;
  }
  start(){if(this.active||!this.relevant())return;this.active=true;this.count=0;this.generation++;this.poll();}
  stop(){this.active=false;this.generation++;if(this.timer!==null)this.cancel(this.timer);this.timer=null;this.abort?.abort();this.abort=null;}
  async poll(){
   if(!this.active||this.inFlight===this.generation)return;
   if(!this.relevant()){this.stop();return;}
   if(this.timer!==null){this.cancel(this.timer);this.timer=null;}
   const generation=this.generation;this.inFlight=generation;this.abort=new AbortController();this.count++;
   try{
    const value=await this.fetchStatus(this.agent,this.requestId,this.abort.signal);
    if(generation!==this.generation||!this.active||!this.relevant())return;
    if(!value||value.agent!==this.agent||value.request_id!==this.requestId||!states.has(value.status))throw Error('Recovery identity/state mismatch');
    if(value.status==='completed'&&typeof value.result!=='string')throw Error('Completed receipt has no verified result');
    this.onUpdate(value);
    if(value.status==='completed'||value.status==='failed'){this.stop();return;}
   }catch(error){
    if(generation===this.generation&&this.active&&this.relevant())this.onUpdate({agent:this.agent,request_id:this.requestId,status:'unknown',result:null,reason:'Status could not be verified. No message was resent.'});
   }finally{
    if(this.inFlight===generation)this.inFlight=false;
    if(generation===this.generation&&this.active){
     if(!this.relevant())this.stop();
     else if(this.count>=this.maxPolls){this.stop();this.onUpdate({agent:this.agent,request_id:this.requestId,status:'unknown',result:null,phase:'polling_paused',reason:'Automatic status reads paused. Use Refresh status; do not resend the task.'});}
     else this.timer=this.schedule(()=>this.poll(),this.interval);
    }
   }
  }
 }
 return {Controller};
})();
if(typeof module!=='undefined'&&module.exports)module.exports=ChatRecovery;


const crRecords=new Map(),crKey='mc.chat.pending.v1';
function crKeyFor(index,id){return agents[index].name.toLowerCase()+'/'+id;}
function crSave(){
 try{sessionStorage.setItem(crKey,JSON.stringify([...crRecords.values()].filter(r=>!['completed','failed'].includes(r.value.status)).map(r=>({agent:agents[r.index].name.toLowerCase(),request_id:r.id}))));return true;}
 catch(_){return false;}
}
function crPaint(index){
 if(current!=='Chat'||chatAgent!==index)return;
 const messages=page.querySelector('[data-chat-messages]');if(!messages)return;
 let panel=page.querySelector('[data-chat-recovery]');
 if(!panel){panel=document.createElement('section');panel.dataset.chatRecovery='';panel.setAttribute('aria-label','Request recovery');messages.before(panel);}
 const records=[...crRecords.values()].filter(r=>r.index===index);
 panel.hidden=!records.length;
 const expanded=new Set(Array.from(panel.querySelectorAll('details[open]')).map(e=>e.dataset.recoveryResult));
 panel.innerHTML=records.map(r=>{
  const value=r.value,label={accepted:'Accepted — awaiting final result',waiting:value.phase==='native_queue'?'Waiting — in native queue':'Waiting for admission confirmation',completed:'Completed',failed:'Failed or cancelled',unknown:'Unknown — not confirmed'}[value.status];
  const result=value.status==='completed'&&typeof value.result==='string'?'<details data-recovery-result="'+esc(r.id)+'"'+(expanded.has(r.id)?' open':'')+'><summary>View verified result for this request</summary><div style="white-space:pre-wrap">'+esc(value.result)+'</div></details>':'';
  return '<div style="padding:8px 0" data-recovery-row="'+esc(r.id)+'"><strong>'+esc(label)+'</strong><p class="muted" role="status">'+esc(value.reason||(value.phase==='native_queue'?'The native queue confirms this request is waiting.':'No additional message is sent by recovery.'))+'</p>'+result+(!['completed','failed'].includes(value.status)?'<button type="button" class="secondary" data-recovery-refresh="'+esc(r.id)+'">Refresh status</button>':'')+'</div>';
 }).join('');
 panel.querySelectorAll('[data-recovery-refresh]').forEach(button=>button.onclick=()=>{const record=crRecords.get(crKeyFor(index,button.dataset.recoveryRefresh));if(record?.controller.active)record.controller.poll();else record?.controller.start();});
}
function crTrack(index,id){
 const key=crKeyFor(index,id);if(crRecords.has(key))return crRecords.get(key);
 const record={index,id,value:{status:'waiting',result:null},files:new Set(chatStates[index].files||[])};
 record.controller=new ChatRecovery.Controller({agent:agents[index].name.toLowerCase(),requestId:id,
  relevant:()=>current==='Chat'&&chatAgent===index&&!document.hidden&&!chatStates[index].busy,
  fetchStatus:async(agent,requestId,signal)=>{
   const response=await fetch('/api/chat/request?'+new URLSearchParams({agent,request_id:requestId}),{cache:'no-store',credentials:'same-origin',signal});
   const data=await response.json();if(!response.ok)throw Error('Existing request status unavailable');return data;
  },
  onUpdate:value=>{
   record.value=value;
   if(value.status==='completed'){
    const state=chatStates[index];
    // A late older request must never clear a newer message's attachment tray.
    if(state.crRequestId===record.id){state.error='';state.files=(state.files||[]).filter(item=>{if(!record.files.has(item))return true;if(item.preview)URL.revokeObjectURL(item.preview);return false;});}
    state.crHistoryWanted=true;
    if(!state.busy){state.crHistoryWanted=false;loadChatHistory(index,true,true);}
   }
   crSave();crPaint(index);
  }});
 crRecords.set(key,record);crSave();crPaint(index);return record;
}
function crBegin(index){
 const id=crypto.randomUUID();chatStates[index].crRequestId=id;crTrack(index,id);return id;
}
function crStreamDone(index,id){

async function cronAction(action,id){
 if(scheduleBusy||scheduleState!=='available'||!['run','pause','resume','delete'].includes(action)||typeof id!=='string'||!jobs.some(j=>j.id===id))return;
 if(action==='delete'&&!window.confirm('Delete this job permanently? This cannot be undone.'))return;
 scheduleEpoch++;scheduleBusy=true;scheduleMessage=action==='run'?'Waiting for the runtime to finish the Run request. Do not retry.':'Sending '+action+' request…';
 if(current==='Schedule')render();
 let accepted=false;
 try{
  const response=await fetch('/api/cron/action?'+new URLSearchParams({action,id}),{method:'POST',body:'',cache:'no-store',credentials:'same-origin',signal:AbortSignal.timeout(action==='run'?240000:15000)});
  const result=await response.json();
  if(!response.ok||result?.error)throw new Error(typeof result?.error==='string'?result.error:'Cron request was rejected');
  accepted=true;
 }catch(error){
  scheduleMessage='Action outcome is unconfirmed: '+(error?.message||'connection error')+'. Do not blindly retry; check the refreshed source.';
 }
 try{
  const response=await fetch('/api/state',{cache:'no-store',credentials:'same-origin',signal:AbortSignal.timeout(8000)});
  if(!response.ok)throw new Error('Source refresh failed');
  receiveScheduleSnapshot(await response.json(),true);
  if(scheduleState!=='available')throw new Error('Cron source unavailable');
  if(accepted){
   const job=jobs.find(j=>j.id===id);
   const verified=action==='run'||(action==='delete'?!job:job?.enabled===(action==='resume'));
   scheduleMessage=verified?(action==='run'?'Run request accepted; completion is not confirmed. Latest source refreshed.':'Change confirmed by refreshed source.'):'Request accepted, but the requested change is not confirmed by the refreshed source. Check before retrying.';
  }
 }catch(error){
  receiveScheduleSnapshot(null,true);
  scheduleMessage=(accepted?'Request accepted, but its outcome could not be verified. ':scheduleMessage+' ')+'Source refresh unavailable. Check before retrying.';
 }finally{
  scheduleEpoch++;scheduleBusy=false;if(current==='Schedule')render();
 }
}
